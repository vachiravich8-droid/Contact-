<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดแอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f1f21;--card:#2a2a2d;--text:#f4f4f5;--muted:#a1a1a8;--accent:#7aac2b;--accent-soft:rgba(122,172,43,.16);--border:rgba(161,161,168,.18);--danger:#f87171}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 60px;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.topbar h1{font-size:22px;margin:0;font-weight:600}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px}
.card h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 16px 0;font-weight:500}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{min-height:44px;padding:11px 24px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-danger:hover{background:rgba(248,113,113,.1)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.msg{font-size:13px;min-height:20px;margin-top:10px}
.msg.ok{color:var(--accent)}.msg.err{color:var(--danger)}
.login-box{max-width:400px;margin:60px auto 0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500}
a.back{color:var(--muted);font-size:13px;text-decoration:none}
a.back:hover{color:var(--accent)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card login-box hidden">
    <h1 style="margin:0 0 4px 0;font-size:22px;">เข้าสู่ระบบแอดมิน</h1>
    <p style="color:var(--muted);font-size:13px;margin:0 0 20px 0;">ค่าเริ่มต้น: admin / admin123</p>
    <div class="field"><label>ชื่อผู้ใช้</label><input type="text" id="loginUser" autocomplete="username" placeholder="admin"></div>
    <div class="field"><label>รหัสผ่าน</label><input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="msg" id="loginMsg"></div>
    <div class="actions"><button class="btn btn-primary" id="loginBtn">เข้าสู่ระบบ</button></div>
    <p style="text-align:center;margin-top:18px;"><a href="/" class="back">← กลับหน้าหลัก</a></p>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="hidden">
    <div class="topbar">
      <div>
        <span class="badge">● เข้าสู่ระบบแล้ว</span>
        <h1 style="margin-top:10px;">แดชบอร์ดแอดมิน</h1>
        <div class="sub">แก้ไขเนื้อหาหน้าเว็บได้ที่นี่ บันทึกแล้วผู้เยี่ยมชมทุกคนจะเห็นทันที</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="/" class="btn btn-ghost" style="text-decoration:none;display:inline-flex;align-items:center;">ดูหน้าเว็บ</a>
        <button class="btn btn-danger" id="logoutBtn">ออกจากระบบ</button>
      </div>
    </div>

    <div class="card">
      <h2>หัวข้อหลัก</h2>
      <div class="field"><label>ข้อความรองหัวข้อ (Tagline)</label><input type="text" id="f_tagline"></div>
      <div class="field"><label>ข้อความใต้หัวข้อ</label><input type="text" id="f_subhead"></div>
    </div>

    <div class="card">
      <h2>แมพ Roblox</h2>
      <div class="field"><label>ชื่อแมพ / เกม</label><input type="text" id="f_robloxName"></div>
      <div class="field"><label>URL แมพ (roblox.com/games/...)</label><input type="text" id="f_robloxUrl"></div>
      <div class="field"><label>คำอธิบายแมพ</label><input type="text" id="f_robloxDesc"></div>
    </div>

    <div class="card">
      <h2>ช่องทางติดต่อ</h2>
      <div class="row">
        <div class="field"><label>Facebook URL</label><input type="text" id="f_fbUrl"></div>
        <div class="field"><label>Facebook Handle</label><input type="text" id="f_fbHandle"></div>
      </div>
      <div class="row">
        <div class="field"><label>Instagram URL</label><input type="text" id="f_igUrl"></div>
        <div class="field"><label>Instagram Handle</label><input type="text" id="f_igHandle"></div>
      </div>
      <div class="row">
        <div class="field"><label>LINE URL</label><input type="text" id="f_lineUrl"></div>
        <div class="field"><label>LINE ID ที่แสดง</label><input type="text" id="f_lineHandle"></div>
      </div>
      <div class="row">
        <div class="field"><label>Discord URL</label><input type="text" id="f_discordUrl"></div>
        <div class="field"><label>Discord Handle</label><input type="text" id="f_discordHandle"></div>
      </div>
    </div>

    <div class="card">
      <h2>อื่นๆ</h2>
      <div class="row">
        <div class="field"><label>อีเมล</label><input type="text" id="f_email"></div>
        <div class="field"><label>เวลาทำการ</label><input type="text" id="f_hours"></div>
      </div>
      <div class="msg" id="saveMsg"></div>
      <div class="actions"><button class="btn btn-primary" id="saveBtn">บันทึกทั้งหมด</button></div>
    </div>

    <div class="card">
      <h2>เปลี่ยนรหัสผ่านแอดมิน</h2>
      <div class="field"><label>รหัสผ่านเก่า</label><input type="password" id="p_old"></div>
      <div class="row">
        <div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label><input type="password" id="p_new"></div>
        <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="p_new2"></div>
      </div>
      <div class="msg" id="passMsg"></div>
      <div class="actions"><button class="btn btn-ghost" id="passBtn">เปลี่ยนรหัสผ่าน</button></div>
    </div>
  </div>

</div>

<script>
(function(){
  var FIELDS=['tagline','subhead','robloxName','robloxUrl','robloxDesc','fbUrl','fbHandle','igUrl','igHandle','lineUrl','lineHandle','discordUrl','discordHandle','email','hours'];
  var loginView=document.getElementById('loginView'),dashView=document.getElementById('dashView');
  function showMsg(id,text,ok){var el=document.getElementById(id);el.textContent=text;el.className='msg '+(ok?'ok':'err');}
  function showLogin(){loginView.classList.remove('hidden');dashView.classList.add('hidden');}
  function showDash(){loginView.classList.add('hidden');dashView.classList.remove('hidden');loadConfig();}

  function loadConfig(){
    fetch('/api/config').then(function(r){return r.json();}).then(function(c){
      FIELDS.forEach(function(k){var el=document.getElementById('f_'+k);if(el)el.value=c[k]||'';});
    });
  }

  // check login status
  fetch('/api/me').then(function(r){return r.json();}).then(function(m){if(m.loggedIn)showDash();else showLogin();}).catch(showLogin);

  document.getElementById('loginBtn').addEventListener('click',function(){
    var u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
      .then(function(r){return r.json();}).then(function(res){
        if(res.ok){showDash();}else{showMsg('loginMsg',res.msg||'เข้าสู่ระบบไม่สำเร็จ',false);}
      });
  });

  document.getElementById('logoutBtn').addEventListener('click',function(){
    fetch('/api/logout',{method:'POST'}).then(function(){showLogin();});
  });

  document.getElementById('saveBtn').addEventListener('click',function(){
    var body={};
    FIELDS.forEach(function(k){var el=document.getElementById('f_'+k);body[k]=el?el.value:'';});
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(res){
        if(res.ok){showMsg('saveMsg','✓ บันทึกเรียบร้อย ผู้เยี่ยมชมจะเห็นข้อมูลใหม่ทันที',true);}
        else if(r.status===401){showMsg('saveMsg','หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่',false);setTimeout(showLogin,1200);}
        else{showMsg('saveMsg',res.msg||'บันทึกไม่สำเร็จ',false);}
      });
  });

  document.getElementById('passBtn').addEventListener('click',function(){
    var o=document.getElementById('p_old').value,n=document.getElementById('p_new').value,n2=document.getElementById('p_new2').value;
    if(n!==n2){showMsg('passMsg','รหัสผ่านใหม่ไม่ตรงกัน',false);return;}
    fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPass:o,newPass:n})})
      .then(function(r){return r.json();}).then(function(res){
        if(res.ok){showMsg('passMsg','✓ เปลี่ยนรหัสผ่านเรียบร้อย',true);document.getElementById('p_old').value='';document.getElementById('p_new').value='';document.getElementById('p_new2').value='';}
        else{showMsg('passMsg',res.msg||'ไม่สำเร็จ',false);}
      });
  });
})();
</script>
</body>
</html>
